components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Page number (1-indexed)
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Page size
    PublisherIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Publisher identifier
    KycSubmissionIdPath:
      name: submissionId
      in: path
      required: true
      schema:
        type: string
      description: KYC submission identifier
    CampaignIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Campaign identifier
    AnalyticsStartDate:
      name: startDate
      in: query
      schema:
        type: string
        format: date-time
      description: Inclusive analytics start date
    AnalyticsEndDate:
      name: endDate
      in: query
      schema:
        type: string
        format: date-time
      description: Inclusive analytics end date
    AnalyticsGranularity:
      name: granularity
      in: query
      schema:
        $ref: '#/components/schemas/AnalyticsGranularity'
      description: Aggregation granularity
    SearchQuery:
      name: query
      in: query
      required: true
      schema:
        type: string
      description: Search query string
    KycIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: KYC submission identifier
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          example: ok
        services:
          type: object
          additionalProperties:
            type: string
    RequestOtp:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    VerifyOtp:
      type: object
      required: [email, otp]
      properties:
        email:
          type: string
          format: email
        otp:
          type: string
          pattern: '^\d{6}$'
    OtpRequestResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
    OtpVerifyResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT access token
    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
    PublisherAccountStatus:
      type: string
      enum: [active, suspended, deleted]
    PublisherSortBy:
      type: string
      enum: [createdAt, updatedAt, email]
    MemberTier:
      type: string
      enum: [all, tier1, tier2, tier3]
    ActivityActorFilter:
      type: string
      enum: [system, publisher, admin]
    PublisherSummary:
      type: object
      properties:
        id:
          type: string
        fullName:
          type: string
        email:
          type: string
          format: email
        isBlacklisted:
          type: boolean
        referralCode:
          type: string
          nullable: true
        referredByCode:
          type: string
          nullable: true
        country:
          type: object
          nullable: true
          properties:
            code:
              type: string
            name:
              type: string
            flagUrl:
              type: string
              nullable: true
        memberCount:
          type: object
          properties:
            total:
              type: integer
            byTier:
              type: object
              properties:
                tier1:
                  type: integer
                tier2:
                  type: integer
                tier3:
                  type: integer
        createdAt:
          type: string
          format: date-time
        createdAtTimeAgo:
          type: string
        kycStatus:
          type: string
        accountStatus:
          type: string
        accountStatusLabelColor:
          type: string
    PublisherPersonalInfo:
      type: object
      properties:
        profilePictureUrl:
          type: string
          nullable: true
        fullName:
          type: string
        accountStatus:
          type: string
        phoneNumber:
          type: string
          nullable: true
        email:
          type: string
          format: email
        dateOfBirth:
          type: string
          format: date
          nullable: true
        gender:
          type: string
          nullable: true
        referralCode:
          type: string
          nullable: true
        nationality:
          type: string
          nullable: true
        idNumber:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        ssoProviders:
          type: array
          items:
            type: string
        referrerCode:
          type: string
          nullable: true
        joinedAt:
          type: string
          format: date-time
        joinedTimeAgo:
          type: string
        lastActiveAt:
          type: string
          format: date-time
          nullable: true
        lastActiveTimeAgo:
          type: string
          nullable: true
    PublisherDetail:
      allOf:
        - $ref: '#/components/schemas/PublisherSummary'
        - type: object
          properties:
            personalInfo:
              $ref: '#/components/schemas/PublisherPersonalInfo'
    InternalNote:
      type: object
      properties:
        id:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
          nullable: true
    PublisherOverview:
      type: object
      properties:
        accountStatus:
          type: string
        kycStatus:
          type: string
        memberSummary:
          type: object
        wallet:
          type: object
        accountStatusHistory:
          type: array
          items:
            type: object
        internalNotes:
          type: array
          items:
            $ref: '#/components/schemas/InternalNote'
        latestTransaction:
          type: object
        blacklistCampaigns:
          type: array
          items:
            $ref: '#/components/schemas/PublisherBlacklistEntry'
        isBlacklisted:
          type: boolean
    PublisherBlacklistEntry:
      type: object
      properties:
        id:
          type: string
        campaignId:
          type: string
          nullable: true
        campaignName:
          type: string
        status:
          type: string
          nullable: true
        addedAt:
          type: string
          format: date-time
        timeAgo:
          type: string
        reason:
          type: string
          nullable: true
        redirectUrl:
          type: string
          nullable: true
    CreateNote:
      type: object
      required: [content]
      properties:
        content:
          type: string
          maxLength: 500
    UpdatePublisherStatus:
      type: object
      required: [targetStatus, reason]
      properties:
        targetStatus:
          $ref: '#/components/schemas/PublisherAccountStatus'
        reason:
          type: string
          maxLength: 500
    RejectKyc:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          maxLength: 500
    PublisherKycItem:
      type: object
      properties:
        id:
          type: string
        uploadedAt:
          type: string
          format: date-time
        uploadedAtFormatted:
          type: string
        timeAgo:
          type: string
        status:
          type: string
        isLatest:
          type: boolean
        frontDocumentUrl:
          type: string
          nullable: true
        backDocumentUrl:
          type: string
          nullable: true
        rejectReason:
          type: string
          nullable: true
    PublisherKycList:
      type: array
      items:
        $ref: '#/components/schemas/PublisherKycItem'
    PublisherMembersResponse:
      type: object
      properties:
        counters:
          type: object
          properties:
            total:
              type: integer
            tier1:
              type: integer
            tier2:
              type: integer
            tier3:
              type: integer
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              fullName:
                type: string
              email:
                type: string
              country:
                type: object
                nullable: true
              tier:
                $ref: '#/components/schemas/MemberTier'
              createdAt:
                type: string
                format: date-time
              createdAtTimeAgo:
                type: string
              accountStatus:
                type: string
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
    PublisherActivityResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
    PublisherListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PublisherSummary'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
    CampaignStatus:
      type: string
      enum: [draft, active, paused, ended]
    CampaignSortBy:
      type: string
      enum: [createdAt, updatedAt, startDate, endDate]
    CreateCampaign:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        startDate:
          type: string
          format: date-time
          nullable: true
        endDate:
          type: string
          format: date-time
          nullable: true
        status:
          $ref: '#/components/schemas/CampaignStatus'
    UpdateCampaign:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        startDate:
          type: string
          format: date-time
          nullable: true
        endDate:
          type: string
          format: date-time
          nullable: true
        status:
          $ref: '#/components/schemas/CampaignStatus'
    CampaignDetail:
      type: object
      description: Campaign payload returned by campaign service
