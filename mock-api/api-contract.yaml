      additionalProperties: true
    AuditLogListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
    AuditLogExportResponse:
      type: object
      properties:
        data:
          type: string
        format:
          type: string
          enum: [csv]
        timestamp:
          type: string
          format: date-time
    SystemStats:
      type: object
      additionalProperties: true
    SystemHealth:
      type: object
      additionalProperties: true
