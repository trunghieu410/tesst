openapi: 3.1.0
info:
  title: OpenK Admin Backend API
  version: 1.0.0
  description: >
    Contract for the OpenK Admin backend services. All protected endpoints require a JWT
    bearer token obtained from the OTP authentication flow.
servers:
  - url: https://{host}/api
    description: Primary deployment
    variables:
      host:
        default: localhost:3000
        description: API hostname without protocol
tags:
  - name: Health
  - name: Auth
  - name: Publishers
  - name: Campaigns
  - name: Analytics
  - name: Notifications
  - name: Reports
  - name: Settings
  - name: Bulk Operations
  - name: Search
  - name: Transactions
  - name: Wallets
  - name: KYC
  - name: Audit Logs
  - name: System
paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      security: []
      responses:
        '200':
          description: Service health snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /auth/otp/request:
    post:
      tags: [Auth]
      summary: Request OTP code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestOtp'
      responses:
        '200':
          description: OTP sent (or treated as sent)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpRequestResponse'
        '429':
          description: Too many OTP requests
  /auth/otp/verify:
    post:
      tags: [Auth]
      summary: Verify OTP and issue JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtp'
      responses:
        '200':
          description: OTP verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpVerifyResponse'
        '401':
          description: Invalid or expired OTP
  /admin/publishers:
    get:
      tags: [Publishers]
      summary: List publishers with filters
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: search
          in: query
          schema:
            type: string
          description: Search by email, full name, or referral code
        - name: createdFrom
          in: query
          schema:
            type: string
            format: date-time
        - name: createdTo
          in: query
          schema:
            type: string
            format: date-time
        - name: countries
          in: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: false
        - name: accountStatuses
          in: query
          schema:
            type: array
            items:
              $ref: '#/components/schemas/PublisherAccountStatus'
          style: form
          explode: false
        - name: minMembers
          in: query
          schema:
            type: integer
            minimum: 0
        - name: sortBy
          in: query
          schema:
            $ref: '#/components/schemas/PublisherSortBy'
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
      responses:
        '200':
          description: Publisher list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublisherListResponse'
  /admin/publishers/{id}:
    get:
      tags: [Publishers]
      summary: Get publisher profile
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PublisherIdPath'
      responses:
        '200':
          description: Publisher detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublisherDetail'
        '404':
          description: Publisher not found
  /admin/publishers/{id}/overview:
    get:
      tags: [Publishers]
      summary: Get publisher overview snapshot
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PublisherIdPath'
      responses:
        '200':
          description: Overview data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublisherOverview'
  /admin/publishers/{id}/members:
    get:
      tags: [Publishers]
      summary: List referral members for a publisher
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PublisherIdPath'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: search
          in: query
          schema:
            type: string
        - name: countries
          in: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: false
        - name: accountStatuses
          in: query
          schema:
            type: array
            items:
              $ref: '#/components/schemas/PublisherAccountStatus'
          style: form
          explode: false
        - name: tier
          in: query
          schema:
            $ref: '#/components/schemas/MemberTier'
      responses:
        '200':
          description: Referral members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublisherMembersResponse'
  /admin/publishers/{id}/notes:
    get:
      tags: [Publishers]
      summary: List internal notes
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PublisherIdPath'
      responses:
        '200':
          description: Notes for publisher
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InternalNote'
    post:
      tags: [Publishers]
      summary: Create an internal note
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PublisherIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNote'
      responses:
        '200':
          description: Updated notes list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InternalNote'
  /admin/publishers/{id}/notes/{noteId}:
    delete:
      tags: [Publishers]
      summary: Delete an internal note
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PublisherIdPath'
        - name: noteId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Updated notes list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InternalNote'
  /admin/publishers/{id}/status:
    post:
      tags: [Publishers]
      summary: Update publisher status
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PublisherIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePublisherStatus'
      responses:
        '200':
          description: Updated overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublisherOverview'
  /admin/publishers/{id}/kyc/{submissionId}/approve:
    post:
      tags: [Publishers]
      summary: Approve latest KYC submission
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PublisherIdPath'
        - $ref: '#/components/parameters/KycSubmissionIdPath'
      responses:
        '200':
          description: KYC submissions with updated status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublisherKycList'
  /admin/publishers/{id}/kyc/{submissionId}/reject:
    post:
      tags: [Publishers]
      summary: Reject latest KYC submission
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PublisherIdPath'
        - $ref: '#/components/parameters/KycSubmissionIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectKyc'
      responses:
        '200':
          description: KYC submissions with updated status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublisherKycList'
  /admin/publishers/{id}/kyc:
    get:
      tags: [Publishers]
      summary: List KYC submissions
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PublisherIdPath'
      responses:
        '200':
          description: KYC submissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublisherKycList'
  /admin/publishers/{id}/disable-2fa:
    post:
      tags: [Publishers]
      summary: Disable publisher 2FA
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PublisherIdPath'
      responses:
        '200':
          description: Disable acknowledgement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccess'
  /admin/publishers/{id}/activity-logs:
    get:
      tags: [Publishers]
      summary: List publisher activity logs
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PublisherIdPath'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: actor
          in: query
          schema:
            $ref: '#/components/schemas/ActivityActorFilter'
      responses:
        '200':
          description: Activity log entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublisherActivityResponse'
  /admin/publishers/{id}/blacklists:
    get:
      tags: [Publishers]
      summary: List campaign blacklist entries
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PublisherIdPath'
      responses:
        '200':
          description: Blacklist entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublisherBlacklistEntry'
  /campaigns:
    get:
      tags: [Campaigns]
      summary: List campaigns
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/CampaignStatus'
        - name: sortBy
          in: query
          schema:
            $ref: '#/components/schemas/CampaignSortBy'
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
      responses:
        '200':
          description: Campaign list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignListResponse'
    post:
      tags: [Campaigns]
      summary: Create campaign
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCampaign'
      responses:
        '201':
          description: Campaign created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignDetail'
  /campaigns/{id}:
    get:
      tags: [Campaigns]
      summary: Get campaign detail
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignIdPath'
      responses:
        '200':
          description: Campaign details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignDetail'
    put:
      tags: [Campaigns]
      summary: Update campaign
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCampaign'
      responses:
        '200':
          description: Campaign updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignDetail'
    delete:
      tags: [Campaigns]
      summary: Delete campaign
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignIdPath'
      responses:
        '200':
          description: Deletion flag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccess'
  /campaigns/{id}/participants:
    get:
      tags: [Campaigns]
      summary: List campaign participants
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignIdPath'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Participant list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignParticipantResponse'
  /campaigns/{id}/activate:
    post:
      tags: [Campaigns]
      summary: Activate a campaign
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignIdPath'
      responses:
        '200':
          description: Updated campaign state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignDetail'
  /campaigns/{id}/pause:
    post:
      tags: [Campaigns]
      summary: Pause a campaign
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignIdPath'
      responses:
        '200':
          description: Updated campaign state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignDetail'
  /campaigns/{id}/end:
    post:
      tags: [Campaigns]
      summary: End a campaign
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignIdPath'
      responses:
        '200':
          description: Updated campaign state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignDetail'
  /campaigns/{id}/analytics:
    get:
      tags: [Campaigns]
      summary: Campaign analytics
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignIdPath'
      responses:
        '200':
          description: Analytics payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsSeriesResponse'
  /campaigns/{id}/statistics:
    get:
      tags: [Campaigns]
      summary: Campaign statistics
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignIdPath'
      responses:
        '200':
          description: Statistic payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignStatsResponse'
  /analytics/dashboard:
    get:
      tags: [Analytics]
      summary: Dashboard metrics
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardMetrics'
  /analytics/users:
    get:
      tags: [Analytics]
      summary: User analytics
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AnalyticsStartDate'
        - $ref: '#/components/parameters/AnalyticsEndDate'
        - $ref: '#/components/parameters/AnalyticsGranularity'
      responses:
        '200':
          description: Analytics series
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsSeriesResponse'
  /analytics/campaigns:
    get:
      tags: [Analytics]
      summary: Campaign analytics
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AnalyticsStartDate'
        - $ref: '#/components/parameters/AnalyticsEndDate'
        - $ref: '#/components/parameters/AnalyticsGranularity'
      responses:
        '200':
          description: Analytics series
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsSeriesResponse'
  /analytics/revenue:
    get:
      tags: [Analytics]
      summary: Revenue analytics
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AnalyticsStartDate'
        - $ref: '#/components/parameters/AnalyticsEndDate'
        - $ref: '#/components/parameters/AnalyticsGranularity'
      responses:
        '200':
          description: Analytics series
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsSeriesResponse'
  /analytics/referrals:
    get:
      tags: [Analytics]
      summary: Referral analytics
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AnalyticsStartDate'
        - $ref: '#/components/parameters/AnalyticsEndDate'
        - $ref: '#/components/parameters/AnalyticsGranularity'
      responses:
        '200':
          description: Analytics series
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsSeriesResponse'
  /notifications:
    get:
      tags: [Notifications]
      summary: List notifications/activity feed
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Notification feed items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationItem'
  /notifications/unread-count:
    get:
      tags: [Notifications]
      summary: Get unread notification count
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Unread count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCount'
  /notifications/{id}/read:
    post:
      tags: [Notifications]
      summary: Mark notification as read
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Mark result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccess'
  /notifications/alerts:
    get:
      tags: [Notifications]
      summary: List system alerts
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SystemAlert'
  /notifications/push:
    post:
      tags: [Notifications]
      summary: Enqueue push notification job
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendPushNotification'
      responses:
        '202':
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushJob'
    get:
      tags: [Notifications]
      summary: List push notification jobs
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Jobs list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PushJob'
  /notifications/push/{jobId}:
    get:
      tags: [Notifications]
      summary: Get push job status
      security:
        - bearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushJob'
  /notifications/push/process:
    post:
      tags: [Notifications]
      summary: Process SQS message payload (internal)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messageBody]
              properties:
                messageBody:
                  type: string
      responses:
        '200':
          description: Processing result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccess'
  /reports/export:
    get:
      tags: [Reports]
      summary: Export reports
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/ReportType'
        - name: format
          in: query
          schema:
            $ref: '#/components/schemas/ReportFormat'
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Report export
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportExportResponse'
            text/csv:
              schema:
                type: string
                format: binary
  /settings:
    get:
      tags: [Settings]
      summary: Get settings snapshot
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Settings data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsSnapshot'
  /settings/referral:
    get:
      tags: [Settings]
      summary: Get referral settings
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Referral settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferralSettings'
    put:
      tags: [Settings]
      summary: Update referral settings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReferralSettings'
      responses:
        '200':
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsUpdateResponse'
  /settings/referral/levels:
    get:
      tags: [Settings]
      summary: List referral levels
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Referral levels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReferralLevel'
    post:
      tags: [Settings]
      summary: Create referral level
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReferralLevel'
      responses:
        '201':
          description: Level created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferralLevel'
  /settings/referral/levels/{id}:
    put:
      tags: [Settings]
      summary: Update referral level
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReferralLevel'
      responses:
        '200':
          description: Updated level
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferralLevel'
    delete:
      tags: [Settings]
      summary: Delete referral level
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deletion acknowledgement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccess'
  /bulk/users/update:
    post:
      tags: [Bulk Operations]
      summary: Bulk update users
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkUpdateUsers'
      responses:
        '200':
          description: Bulk update result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationResult'
  /bulk/users/export:
    post:
      tags: [Bulk Operations]
      summary: Bulk export users
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkExportFilters'
      responses:
        '200':
          description: Export result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkExportResponse'
  /bulk/campaigns/update:
    post:
      tags: [Bulk Operations]
      summary: Bulk update campaigns
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
