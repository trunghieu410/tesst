    CampaignListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CampaignDetail'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
    CampaignParticipantResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
    AnalyticsGranularity:
      type: string
      enum: [hour, day, week, month]
    AnalyticsSeriesResponse:
      type: object
      properties:
        series:
          type: array
          items:
            type: object
        totals:
          type: object
    DashboardMetrics:
      type: object
      description: Dashboard metrics snapshot
      additionalProperties: true
    NotificationItem:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        body:
          type: string
        createdAt:
          type: string
          format: date-time
        read:
          type: boolean
    UnreadCount:
      type: object
      properties:
        count:
          type: integer
    SystemAlert:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        message:
          type: string
        createdAt:
          type: string
          format: date-time
    SendPushNotification:
      type: object
      required: [title, body]
      properties:
        title:
          type: string
        body:
          type: string
        data:
          type: object
          additionalProperties: true
        imageUrl:
          type: string
          nullable: true
        clickAction:
          type: string
          nullable: true
        userIds:
          type: array
          items:
            type: string
        filters:
          type: object
          properties:
            status:
              type: array
              items:
                type: string
            hasFCMToken:
              type: boolean
        useSQS:
          type: boolean
          default: true
        batchSize:
          type: integer
          minimum: 1
          maximum: 10000
          default: 1000
    PushJob:
      type: object
      properties:
        jobId:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        metrics:
          type: object
          additionalProperties: true
    ReportType:
