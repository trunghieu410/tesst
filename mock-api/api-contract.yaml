    BulkExportResponse:
      type: object
      properties:
        filename:
          type: string
        data:
          type: array
          items:
            type: object
        count:
          type: integer
    SearchResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
    TransactionSortBy:
      type: string
      enum: [createdAt, amount]
    TransactionListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
    WalletListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
    ReviewKyc:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [approved, rejected, pending]
