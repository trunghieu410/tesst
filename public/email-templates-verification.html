<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:v="urn:schemas-microsoft-com:vml"
  xmlns:o="urn:schemas-microsoft-com:office:office"
>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="x-apple-disable-message-reformatting" />
    <title>Verify your email</title>
    <!--[if mso]>
      <xml>
        <o:OfficeDocumentSettings>
          <o:PixelsPerInch>96</o:PixelsPerInch>
        </o:OfficeDocumentSettings>
      </xml>
    <![endif]-->
    <style type="text/css">
      /* Reset styles */
      body,
      table,
      td,
      a {
        -webkit-text-size-adjust: 100%;
        -ms-text-size-adjust: 100%;
      }
      table,
      td {
        mso-table-lspace: 0pt;
        mso-table-rspace: 0pt;
      }
      img {
        -ms-interpolation-mode: bicubic;
      }
      img {
        border: 0;
        height: auto;
        line-height: 100%;
        outline: none;
        text-decoration: none;
      }
      table {
        border-collapse: collapse !important;
      }
      body {
        height: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        width: 100% !important;
      }

      /* Mobile styles */
      @media screen and (max-width: 600px) {
        .email-container {
          width: 100% !important;
          max-width: 100% !important;
        }
        .padding-container {
          padding-left: 20px !important;
          padding-right: 20px !important;
        }
        .mobile-stack {
          display: block !important;
          width: 100% !important;
        }
        .code-cell {
          width: 40px !important;
          height: 48px !important;
          font-size: 20px !important;
        }
      }
    </style>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    "
  >
    <!-- Center the email -->
    <center style="width: 100%; table-layout: fixed; background-color: #ffffff">
      <!--[if mso]>
        <table role="presentation" width="600" align="center" style="width:600px;" border="0" cellspacing="0" cellpadding="0">
        <tr>
        <td align="center" style="padding:0;">
        <![endif]-->

      <table
        class="email-container"
        role="presentation"
        border="0"
        cellpadding="0"
        cellspacing="0"
        width="100%"
        style="max-width: 584px; margin: 0 auto; background-color: #ffffff"
      >
        <!-- Header / Logo -->
        <tr>
          <td
            align="left"
            style="padding: 48px 0px 32px 0px"
            class="padding-container"
          >
            <!-- IMPORTANT: Replace with absolute URL for production -->
            <img
              src="ok-logo.svg"
              width="56"
              height="56"
              alt="OpenKingdom"
              style="
                display: block;
                border: 0;
                width: 56px;
                max-width: 56px;
                height: auto;
              "
            />
          </td>
        </tr>

        <!-- Body Content -->
        <tr>
          <td
            align="left"
            style="padding: 0 0 32px 0"
            class="padding-container"
          >
            <h1
              style="
                margin: 0 0 32px 0;
                font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
                font-size: 24px;
                line-height: 32px;
                font-weight: bold;
                color: #000000;
              "
            >
              Your verification code
            </h1>

            <p
              style="
                margin: 0 0 24px 0;
                font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
                font-size: 14px;
                line-height: 22px;
                color: #333333;
              "
            >
              The code expires in
              <strong style="font-weight: bold">30 minutes</strong>.<br />
              Please enter this code to verify your email address for
              OpenKingdom.
            </p>

            <!-- Verification Code Block -->
            <table
              role="presentation"
              border="0"
              cellpadding="0"
              cellspacing="0"
              style="margin-bottom: 32px"
            >
              <tr>
                <!-- Code Digit 1 -->
                <td
                  align="center"
                  valign="middle"
                  width="12"
                  height="48"
                  style="
                    width: 12px;
                    height: 48px;
                    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
                    font-size: 24px;
                    font-weight: bold;
                    color: #2b2929;
                  "
                >
                  5
                </td>
                <td width="12" style="width: 12px"></td>

                <!-- Code Digit 2 -->
                <td
                  align="center"
                  valign="middle"
                  width="12"
                  height="48"
                  style="
                    width: 12px;
                    height: 48px;
                    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
                    font-size: 24px;
                    font-weight: bold;
                    color: #2b2929;
                  "
                >
                  0
                </td>
                <td width="12" style="width: 12px"></td>

                <!-- Code Digit 3 -->
                <td
                  align="center"
                  valign="middle"
                  width="12"
                  height="48"
                  style="
                    width: 12px;
                    height: 48px;
                    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
                    font-size: 24px;
                    font-weight: bold;
                    color: #2b2929;
                  "
                >
                  3
                </td>
                <td width="12" style="width: 12px"></td>

                <!-- Code Digit 4 -->
                <td
                  align="center"
                  valign="middle"
                  width="12"
                  height="48"
                  style="
                    width: 12px;
                    height: 48px;
                    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
                    font-size: 24px;
                    font-weight: bold;
                    color: #2b2929;
                  "
                >
                  4
                </td>
                <td width="12" style="width: 12px"></td>

                <!-- Code Digit 5 -->
                <td
                  align="center"
                  valign="middle"
                  width="12"
                  height="48"
                  style="
                    width: 12px;
                    height: 48px;
                    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
                    font-size: 24px;
                    font-weight: bold;
                    color: #2b2929;
                  "
                >
                  8
                </td>
                <td width="12" style="width: 12px"></td>

                <!-- Code Digit 6 -->
                <td
                  align="center"
                  valign="middle"
                  width="12"
                  height="48"
                  style="
                    width: 12px;
                    height: 48px;
                    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
                    font-size: 24px;
                    font-weight: bold;
                    color: #2b2929;
                  "
                >
                  2
                </td>
              </tr>
            </table>

            <p
              style="
                margin: 0;
                font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
                font-size: 14px;
                line-height: 22px;
                color: #333333;
              "
            >
              Best Regards,<br />
              <strong style="font-weight: bold; color: #021337"
                >OpenKingdom team.</strong
              >
            </p>
          </td>
        </tr>

        <!-- Divider -->
        <tr>
          <td align="left" style="padding: 0" class="padding-container">
            <table
              role="presentation"
              border="0"
              cellpadding="0"
              cellspacing="0"
              width="100%"
            >
              <tr>
                <td
                  height="1"
                  style="
                    background-color: #e5e5e5;
                    line-height: 1px;
                    font-size: 1px;
                  "
                >
                  &nbsp;
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- Footer -->
        <tr>
          <td align="left" style="padding: 32px 0" class="padding-container">
            <table
              role="presentation"
              border="0"
              cellpadding="0"
              cellspacing="0"
              width="100%"
            >
              <tr>
                <!-- Copyright & Links -->
                <td
                  valign="top"
                  align="left"
                  style="
                    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
                    font-size: 12px;
                    line-height: 18px;
                    color: #666666;
                  "
                >
                  <p style="margin: 0 0 0 0">
                    &copy; 2025 OpenKingdom. All rights reserved.
                  </p>
                  <p style="margin: 0">
                    <a
                      href="#"
                      style="color: #666666; text-decoration: underline"
                      >Privacy policy</a
                    >
                    &nbsp;&bull;&nbsp;
                    <a
                      href="#"
                      style="color: #666666; text-decoration: underline"
                      >Terms of service</a
                    >
                    &nbsp;&bull;&nbsp;
                    <a
                      href="#"
                      style="color: #666666; text-decoration: underline"
                      >Help center</a
                    >
                  </p>
                </td>

                <!-- Store Icons -->
                <td valign="top" align="right" style="padding-left: 20px">
                  <table
                    role="presentation"
                    border="0"
                    cellpadding="0"
                    cellspacing="0"
                  >
                    <tr>
                      <td style="padding-right: 12px">
                        <a
                          href="#"
                          target="_blank"
                          style="display: inline-block; text-decoration: none"
                        >
                          <img
                            src="app-store.svg"
                            width="96"
                            height="32"
                            alt="Download on the App Store"
                            style="display: block; width: 96px; height: 32px"
                          />
                        </a>
                      </td>
                      <td style="padding-left: 12px">
                        <a
                          href="#"
                          target="_blank"
                          style="display: inline-block; text-decoration: none"
                        >
                          <img
                            src="google-play.svg"
                            width="109"
                            height="32"
                            alt="Get it on Google Play"
                            style="display: block; width: 109px; height: 32px"
                          />
                        </a>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>
            </table>
          </td>
        </tr>
      </table>

      <!--[if mso]>
        </td>
        </tr>
        </table>
        <![endif]-->
    </center>
  </body>
</html>
